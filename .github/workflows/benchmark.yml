name: benchmark

on:
  workflow_dispatch:
    inputs:
      record-baseline:
        description: >-
          Record this run as the new CI baseline and commit
          bench/results/ci-baseline.json (refresh after intentional changes).
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same caching behavior as the nightly workflow (which restores AND
      # saves): sccache as the compiler launcher through the Ninja generator
      # (MSBuild ignores CMAKE_<LANG>_COMPILER_LAUNCHER), with the cache
      # entries shared across ci/nightly/benchmark via common restore-key
      # prefixes. Benchmark timing measures scenario execution, not build
      # time, so a warm compiler cache does not skew results.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-sccache-benchmark-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-benchmark-
            ${{ runner.os }}-sccache-

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DLODE_BUILD_BENCH=ON
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build

      # CI compares against its own committed baseline (bench/results/
      # ci-baseline.json), never against local-machine numbers: the runner
      # hardware is the public reference. The first run (or an explicit
      # record-baseline dispatch) records the baseline instead of gating.
      # Full output — including the delta table — is mirrored into the job
      # summary so regressions are visible without opening the log.
      - name: Run benchmarks (self-test + measure + compare + save)
        shell: pwsh
        run: |
          if ("${{ inputs.record-baseline }}" -eq "true") {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -RecordBaseline 2>&1 | Tee-Object -Variable benchOut
          } elseif (-not (Test-Path bench/results/ci-baseline.json)) {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -RecordBaseline 2>&1 | Tee-Object -Variable benchOut
          } else {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -FailOnRegression 2>&1 | Tee-Object -Variable benchOut
          }
          $code = $LASTEXITCODE
          $table = $benchOut | Where-Object { $_ -match 'metric|REGRESSED|NEW|ns/op' }
          ($table -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      - name: Show sccache stats
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: sccache --show-stats

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench/results/
          if-no-files-found: error

      - name: Commit refreshed CI baseline
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $modified = git status --porcelain -- bench/results/ci-baseline.json
          if ($modified) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Re-attach to main: checkout with ref: main leaves a detached HEAD
            # when the dispatch ran on the default branch SHA.
            git checkout -B main
            git add bench/results/ci-baseline.json
            git commit -m "bench(ci): refresh CI baseline"
            git push origin main
            Write-Host "ci baseline committed"
          } else {
            Write-Host "ci baseline unchanged, nothing to commit"
          }

name: benchmark

on:
  workflow_dispatch:
    inputs:
      record-baseline:
        description: >-
          Record this run as the new CI baseline and commit
          bench/results/ci-baseline.json (refresh after intentional changes).
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ddd0023b0eee70986e42ed49d9d4afb8098f212e

      - name: Restore vcpkg binary packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-benchmark-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # Restore-only caching, mirroring the nightly workflow: this workflow
      # consumes the entries written by ci.yml (via the common restore-key
      # prefixes) but never saves any back — ci.yml is the single cache
      # writer. Benchmark timing measures scenario execution, not build
      # time, so cache warmth does not skew results.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Restore sccache (no save)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-sccache-benchmark-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Restore FetchContent (no save)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DLODE_BUILD_BENCH=ON
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build

      # CI compares against its own committed baseline (bench/results/
      # ci-baseline.json), never against local-machine numbers: the runner
      # hardware is the public reference. The first run (or an explicit
      # record-baseline dispatch) records the baseline instead of gating.
      # Never fails the job here: the fallback renderer below re-renders
      # the table from the JSON artifacts.
      - name: Run benchmarks (self-test + measure + compare + save)
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY

          if ("${{ inputs.record-baseline }}" -eq "true" -or -not (Test-Path 'bench/results/ci-baseline.json')) {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -RecordBaseline -SummaryPath:$summary
          } else {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -FailOnRegression -SummaryPath:$summary
          }
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host "::warning::bench exited with code $code" }
          Add-Content -Path $summary -Value '(summary written by run_bench.ps1)'
          exit 0

      # Fallback renderer: rebuilds the Markdown delta table directly from
      # the saved result JSON + committed baseline and appends it to the job
      # summary. Guarantees the table is visible even if the in-script
      # summary pass produced nothing.
      - name: Render benchmark summary
        shell: pwsh
        run: |
          $resultsFile = Get-ChildItem 'bench/results/bench-results-*.json' |
            Sort-Object LastWriteTime | Select-Object -Last 1
          $baselineFile = 'bench/results/ci-baseline.json'
          if (-not $resultsFile -or -not (Test-Path $baselineFile)) {
            Write-Host '::warning::benchmark results or baseline not found'
            exit 0
          }
          $res = Get-Content -Raw $resultsFile.FullName | ConvertFrom-Json
          $base = Get-Content -Raw $baselineFile | ConvertFrom-Json
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('### Benchmark results')
          $lines.Add('')
          $lines.Add('Commit: ' + $res.commit)
          $lines.Add('')
          $lines.Add('| metric | baseline | now | delta% | flag |')
          $lines.Add('|---|---:|---:|---:|---|')
          foreach ($section in @('cpp','luau')) {
            # Flatten sections into hashtables: dynamic property access on
            # PSCustomObject is unreliable on Windows PowerShell 5.1.
            $cur = @{}
            foreach ($pr in $res.metrics.$section.PSObject.Properties) { $cur[$pr.Name] = [double]$pr.Value }
            $oldSec = @{}
            foreach ($pr in $base.metrics.$section.PSObject.Properties) { $oldSec[$pr.Name] = [double]$pr.Value }
            foreach ($key in $cur.Keys) {
              $new = [double]$cur[$key]
              if ($oldSec.ContainsKey($key)) {
                $old = [double]$oldSec[$key]
                $delta = [math]::Round(($new - $old) / $old * 100.0, 2)
                $flag = if ($delta -gt 5) { '**REGRESSED**' } elseif ($delta -lt -5) { 'improved' } else { '' }
                $lines.Add('| ' + $section + '.' + $key + ' | ' + ('{0:F2}' -f $old) + ' | ' + ('{0:F2}' -f $new) + ' | ' + $delta + '% | ' + $flag + ' |')
              } else {
                $lines.Add('| ' + $section + '.' + $key + ' | - | ' + ('{0:F2}' -f $new) + ' | NEW |')
              }
            }
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Output '::notice::benchmark summary rendered'

      - name: Show sccache stats
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: sccache --show-stats

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench/results/
          if-no-files-found: error

      - name: Commit refreshed CI baseline
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $modified = git status --porcelain -- bench/results/ci-baseline.json
          if ($modified) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B main
            git add bench/results/ci-baseline.json
            git commit -m "bench(ci): refresh CI baseline"
            git push origin main
            Write-Host "ci baseline committed"
          } else {
            Write-Host "ci baseline unchanged, nothing to commit"
          }

name: benchmark

on:
  workflow_dispatch:
    inputs:
      record-baseline:
        description: >-
          Record this run as the new CI baseline and commit
          bench/results/ci-baseline.json (refresh after intentional changes).
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compiler-cache tooling. The Visual Studio (MSBuild) generator ignores
      # CMAKE_<LANG>_COMPILER_LAUNCHER, so this workflow uses the Ninja
      # generator (same pattern as ci.yml) with ccache as the launcher.
      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache
        run: choco install ccache -y --no-progress

      # Restore-only: the runner reuses a warm compiler cache to speed up the
      # build, but this workflow never SAVES a cache entry back. Benchmarks
      # measure compile-from-scratch machines fairly, and a cold cache cannot
      # skew the timing comparison either way (the baseline was recorded the
      # same way). Restore keys fall back to any recent ccache from this
      # branch or from main.
      - name: Restore ccache (no save)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # Restore-only dependencies downloaded via FetchContent (saved by
      # ci.yml), same ownership rule as the nightly workflow.
      - name: Restore FetchContent (no save)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DLODE_BUILD_BENCH=ON
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Release
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: cmake --build build

      # CI compares against its own committed baseline (bench/results/
      # ci-baseline.json), never against local-machine numbers: the runner
      # hardware is the public reference. The first run (or an explicit
      # record-baseline dispatch) records the baseline instead of gating.
      - name: Run benchmarks (self-test + measure + compare + save)
        shell: pwsh
        run: |
          if ("${{ inputs.record-baseline }}" -eq "true") {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -RecordBaseline
          } elseif (-not (Test-Path bench/results/ci-baseline.json)) {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -RecordBaseline
          } else {
            ./bench/run_bench.ps1 -Baseline bench/results/ci-baseline.json -FailOnRegression
          }

      - name: Show ccache stats
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ccache --show-stats

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench/results/
          if-no-files-found: error

      - name: Commit refreshed CI baseline
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $modified = git status --porcelain -- bench/results/ci-baseline.json
          if ($modified) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Re-attach to main: checkout with ref: main leaves a detached HEAD
            # when the dispatch ran on the default branch SHA.
            git checkout -B main
            git add bench/results/ci-baseline.json
            git commit -m "bench(ci): refresh CI baseline"
            git push origin main
            Write-Host "ci baseline committed"
          } else {
            Write-Host "ci baseline unchanged, nothing to commit"
          }

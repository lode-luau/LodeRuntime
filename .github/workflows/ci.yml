name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'docs/**'
      - 'rfcs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'docs/**'
      - 'rfcs/**'

permissions:
  contents: read

jobs:
  change-gate:
    runs-on: ubuntu-latest
    outputs:
      real: ${{ steps.check.outputs.real }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shush
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/shush" \
            "https://github.com/carlosarraes/shush/releases/download/v0.3.3/shush-linux-x86_64"
          chmod +x "$HOME/.local/bin/shush"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decide whether CI should build
        id: check
        shell: bash
        run: |
          set -uo pipefail
          SHA="${{ github.sha }}"
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "real=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            pull_request)
              BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)" ;;
            push)
              BASE="${{ github.event.before }}"
              if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null 2>&1; then
                git fetch --quiet origin main
                BASE="$(git merge-base FETCH_HEAD HEAD)"
              fi ;;
            *) BASE="" ;;
          esac
          if [ -z "$BASE" ]; then
            echo "real=true" >> "$GITHUB_OUTPUT"
          elif bash .github/scripts/is-real-change.sh "$BASE" "$SHA"; then
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: change-gate
    if: needs.change-gate.outputs.real == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ddd0023b0eee70986e42ed49d9d4afb8098f212e

      - name: Select target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = windows ]; then
            echo "architecture=x64" >> "$GITHUB_OUTPUT"
            echo "triplet=x64-windows" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.platform }}" = linux ]; then
            echo "architecture=x64" >> "$GITHUB_OUTPUT"
            echo "triplet=x64-linux" >> "$GITHUB_OUTPUT"
          elif [ "$(uname -m)" = arm64 ]; then
            echo "architecture=arm64" >> "$GITHUB_OUTPUT"
            echo "triplet=arm64-osx" >> "$GITHUB_OUTPUT"
          else
            echo "architecture=x64" >> "$GITHUB_OUTPUT"
            echo "triplet=x64-osx" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sccache on Windows
        if: matrix.platform == 'windows'
        run: choco install sccache -y --no-progress

      - name: Setup sccache on POSIX
        if: matrix.platform != 'windows'
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-${{ steps.target.outputs.triplet }}-sccache-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.target.outputs.triplet }}-sccache-

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-${{ steps.target.outputs.triplet }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.target.outputs.triplet }}-vcpkg-
            ${{ runner.os }}-vcpkg-

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Enable MSVC toolchain
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Debug on Windows
        if: matrix.platform == 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: >-
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure Debug on POSIX
        if: matrix.platform != 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        shell: bash
        run: >-
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Debug
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-debug

      - name: Validate Debug sanity suite on Windows
        if: matrix.platform == 'windows'
        run: ./build-debug/bin/Debug/lode.exe modules/sanity/run.luau

      - name: Validate Debug sanity suite on POSIX
        if: matrix.platform != 'windows'
        run: ./build-debug/bin/Debug/lode modules/sanity/run.luau

      - name: Validate Debug with CTest
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      - name: Configure Release on Windows
        if: matrix.platform == 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: >-
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure Release on POSIX
        if: matrix.platform != 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        shell: bash
        run: >-
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-release

      - name: Validate Release sanity suite on Windows
        if: matrix.platform == 'windows'
        run: ./build-release/bin/Release/lode.exe modules/sanity/run.luau

      - name: Validate Release sanity suite on POSIX
        if: matrix.platform != 'windows'
        run: ./build-release/bin/Release/lode modules/sanity/run.luau

      - name: Validate Release with CTest
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Show sccache stats
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: sccache --show-stats

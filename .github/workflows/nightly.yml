name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute nightly version
        id: version
        shell: bash
        run: |
          # Nightly versioning is 0.1.0-nightly.YYYYMMDD.N (dot suffix).
          # The counter also accounts for legacy 0.1.0-nightly.YYYYMMDD-N
          # (dash suffix) tags so a same-day manual run continues from the
          # last published number instead of restarting at .1.
          DATE_UTC=$(date -u +%Y%m%d)
          SUFFIXES=$(git ls-remote --tags origin \
            "refs/tags/0.1.0-nightly.${DATE_UTC}-*" \
            "refs/tags/0.1.0-nightly.${DATE_UTC}.*" \
            | awk '{ ref = $2; sub(/refs\/tags\/0\.1\.0-nightly\.[0-9]+[-.]/, "", ref); if (ref ~ /^[0-9]+$/) print ref }')
          MAX=0
          for S in $SUFFIXES; do
            [ "$S" -gt "$MAX" ] && MAX=$S
          done
          N=$((MAX + 1))
          echo "version=0.1.0-nightly.${DATE_UTC}.${N}" >> "$GITHUB_OUTPUT"

      # 1. Set up the sccache tool. The Visual Studio (MSBuild) generator
      #    ignores CMAKE_<LANG>_COMPILER_LAUNCHER, so CI uses the Ninja
      #    generator (with separate Debug/Release trees), which honors it.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      # 2. Restore/save cache of compiled C++ objects, falling back to the
      #    cache written by the ci workflow so main and nightly share hits.
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-sccache-nightly-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-nightly-
            ${{ runner.os }}-sccache-

      # 3. Restore/save dependencies downloaded via FetchContent. Both build
      #    trees share one base via FETCHCONTENT_BASE_DIR so there is a single
      #    source/download to cache.
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # 4. Ninja needs the MSVC toolchain on PATH; without this it would pick
      #    the MinGW GCC that is also present on windows-latest runners.
      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      # 5. Configure Debug (Ninja single-config tree). ${{ runner.temp }} is
      #    only available in step-level env, not workflow/job-level env.
      - name: Configure Debug
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: >-
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Debug
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-debug

      - name: Validate Debug (sanity suite)
        run: ./build-debug/bin/Debug/lode_runtime.exe modules/sanity/run.luau

      - name: "Validate Debug (ctest: native fixtures + diagnostics)"
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      # 6. Configure Release (Ninja single-config tree, reuses shared deps)
      - name: Configure Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: >-
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-release

      - name: Validate Release (sanity suite)
        run: ./build-release/bin/Release/lode_runtime.exe modules/sanity/run.luau

      - name: "Validate Release (ctest: native fixtures + diagnostics)"
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Show sccache stats
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $runtimeDist = "dist/runtime"
          $modulesDist = "dist/modules"
          New-Item -ItemType Directory -Force -Path $runtimeDist | Out-Null
          New-Item -ItemType Directory -Force -Path $modulesDist | Out-Null

          # ---- Runtime artifact: executable, core DLLs, headers ----
          Copy-Item build-release/bin/Release/lode_runtime.exe $runtimeDist
          Copy-Item build-release/bin/Release/LodeCore.dll $runtimeDist
          Copy-Item build-release/bin/Release/uv.dll $runtimeDist
          Copy-Item include/Lode $runtimeDist/Lode -Recurse
          Copy-Item LICENSE, README.md $runtimeDist
          Set-Content -Path "$runtimeDist/VERSION" -Value $ver

          # ---- Modules artifact: recursive module discovery ----
          # Every directory (recursively) that has a lode.json manifest is a
          # package (native or pure-Luau). This supports nested modules such as
          # filesystem/path without touching this workflow when modules change.
          $moduleDirs = Get-ChildItem modules -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName "lode.json") }
          $modulesRoot = (Resolve-Path modules).Path

          # Map of module relative paths (forward slashes) so a parent module's
          # copy skips its nested module directories (handled separately).
          $moduleRelSet = @{}
          foreach ($mdir in $moduleDirs) {
              $rel = $mdir.FullName.Substring($modulesRoot.Length + 1).Replace('\', '/')
              $moduleRelSet[$rel] = $true
          }

          $shipped = @()
          foreach ($mdir in $moduleDirs) {
              $rel = $mdir.FullName.Substring($modulesRoot.Length + 1).Replace('\', '/')
              $name = $mdir.Name
              $src = "modules/$rel"
              $dst = Join-Path $modulesDist "modules/$rel"
              New-Item -ItemType Directory -Force -Path $dst | Out-Null

              $isNative = Test-Path "$src/CMakeLists.txt"
              Get-ChildItem $src | ForEach-Object {
                  $childRel = "$rel/$($_.Name)"
                  $isNestedModule = $_.PSIsContainer -and $moduleRelSet.ContainsKey($childRel)
                  # Exclude build-time files and the libs/ tree (rebuilt below
                  # with only the shipped platform, windows/x64). src/ is
                  # excluded only for native modules (those with a
                  # CMakeLists.txt); pure-Luau modules keep their src/.
                  $isExcluded = $_.Name -eq "CMakeLists.txt" -or $_.Name -eq "libs" -or ($_.Name -eq "src" -and $isNative)
                  if (-not $isNestedModule -and -not $isExcluded) {
                      Copy-Item $_.FullName (Join-Path $dst $_.Name) -Recurse
                  }
              }

              # Native modules keep their config-matched DLL in the module's
              # own libs/<platform>/<arch>/<config> entry from lode.json; the
              # loader resolves the config-aware subdir per runtime build.
              if ($isNative) {
                  $libRelease = "$src/libs/windows/x64/Release/$name.dll"
                  $libFlat = "$src/libs/windows/x64/$name.dll"
                  $libBin = "build-release/bin/Release/$name.dll"

                  $sourceDll = $null
                  if (Test-Path $libRelease) {
                      $sourceDll = $libRelease
                  } elseif (Test-Path $libFlat) {
                      $sourceDll = $libFlat
                  } elseif (Test-Path $libBin) {
                      $sourceDll = $libBin
                  }

                  if ($sourceDll) {
                      $libDirRelease = "$dst/libs/windows/x64/Release"
                      New-Item -ItemType Directory -Force -Path $libDirRelease | Out-Null
                      Copy-Item $sourceDll "$libDirRelease/$name.dll" -Force
                  } else {
                      Write-Error "Native library for $name was not found at $libRelease, $libFlat, or $libBin"
                  }
              }
              $shipped += $rel
          }

          # Alias config so require("@name") resolves for every shipped module.
          $aliasLines = foreach ($mdir in $moduleDirs) {
              $rel = $mdir.FullName.Substring($modulesRoot.Length + 1).Replace('\', '/')
              $name = $mdir.Name
              "            $name = `"modules/$rel`","
          }
          $config = @"
          return {
              luau = {
                  languagemode = "nonstrict",
                  lint = {
                      ["*"] = true,
                      LocalUnused = false
                  },
                  linterrors = true,
                  typeerrors = true,
                  aliases = {
          $($aliasLines -join "`n")
                  }
              }
          }
          "@
          Set-Content -Path "$modulesDist/.config.luau" -Value $config
          Copy-Item LICENSE, README.md $modulesDist
          Set-Content -Path "$modulesDist/VERSION" -Value $ver

          Compress-Archive -Path $runtimeDist -DestinationPath "lode-windows-x64-$ver.zip"
          Compress-Archive -Path $modulesDist -DestinationPath "lode-windows-x64-modules-$ver.zip"

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" "lode-windows-x64-${{ steps.version.outputs.version }}.zip" "lode-windows-x64-modules-${{ steps.version.outputs.version }}.zip" --title "Nightly ${{ steps.version.outputs.version }}" --notes "Automated nightly build. Built and validated on the sanity suite and integration tests." --prerelease

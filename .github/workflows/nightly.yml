name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute nightly version
        id: version
        shell: bash
        run: |
          # Nightly versioning is 0.1.0-nightly.YYYYMMDD.N (dot suffix).
          # The counter also accounts for legacy 0.1.0-nightly.YYYYMMDD-N
          # (dash suffix) tags so a same-day manual run continues from the
          # last published number instead of restarting at .1.
          DATE_UTC=$(date -u +%Y%m%d)
          SUFFIXES=$(git ls-remote --tags origin \
            "refs/tags/0.1.0-nightly.${DATE_UTC}-*" \
            "refs/tags/0.1.0-nightly.${DATE_UTC}.*" \
            | awk '{ ref = $2; sub(/refs\/tags\/0\.1\.0-nightly\.[0-9]+[-.]/, "", ref); if (ref ~ /^[0-9]+$/) print ref }')
          MAX=0
          for S in $SUFFIXES; do
            [ "$S" -gt "$MAX" ] && MAX=$S
          done
          N=$((MAX + 1))
          echo "version=0.1.0-nightly.${DATE_UTC}.${N}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Build Release
        run: cmake --build build --config Release

      - name: Validate Debug (sanity suite)
        run: ./build/bin/Debug/lode_runtime.exe modules/sanity/run.luau

      - name: Validate Release (sanity suite)
        run: ./build/bin/Release/lode_runtime.exe modules/sanity/run.luau

      - name: Validate Debug (integration test)
        run: ./build/bin/Debug/lode_runtime.exe temp/test.luau

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $dist = "dist/$ver"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/bin/Release/lode_runtime.exe $dist
          Copy-Item build/bin/Release/LodeCore.dll $dist
          Copy-Item build/bin/Release/uv.dll $dist

          # Modules are discovered automatically: any modules/<name> folder with
          # a lode.json manifest is a package (native or pure-Luau). New modules
          # get packaged without touching this workflow.
          $shipped = @()
          foreach ($m in (Get-ChildItem modules -Directory | Where-Object { Test-Path (Join-Path $_.FullName "lode.json") } | Select-Object -ExpandProperty Name)) {
              $src = "modules/$m"
              $dst = Join-Path $dist "modules/$m"
              New-Item -ItemType Directory -Force -Path $dst | Out-Null
              # Everything except build-time files and the libs/ tree (rebuilt
              # below with only the shipped platform, windows/x64). src/ is
              # excluded only for native modules (those with a CMakeLists.txt);
              # pure-Luau modules keep their src/ (e.g. sanity's Reporter).
              $excludes = @("CMakeLists.txt", "libs")
              if (Test-Path "$src/CMakeLists.txt") { $excludes += "src" }
              Copy-Item "$src/*" $dst -Recurse -Exclude $excludes
              # Native modules: config-matched DLL next to the executable (the
              # loader prefers the exe-dir copy, see ModuleLoader.cpp) plus the
              # module's own libs/ entry from lode.json.
              $nativeLib = "build/bin/Release/$m.dll"
              if (Test-Path $nativeLib) {
                  Copy-Item $nativeLib $dist
                  $libDir = "$dst/libs/windows/x64"
                  New-Item -ItemType Directory -Force -Path $libDir | Out-Null
                  Copy-Item "$src/libs/windows/x64/$m.dll" $libDir
              }
              $shipped += $m
          }

          # Alias config so require("@name") resolves for every shipped module.
          $aliasLines = foreach ($m in $shipped) { "            $m = `"modules/$m`"," }
          $config = @"
          return {
              luau = {
                  languagemode = "nonstrict",
                  lint = {
                      ["*"] = true,
                      LocalUnused = false
                  },
                  linterrors = true,
                  typeerrors = true,
                  aliases = {
          $($aliasLines -join "`n")
                  }
              }
          }
          "@
          Set-Content -Path "$dist/.config.luau" -Value $config

          Copy-Item include/Lode $dist/Lode -Recurse
          Copy-Item LICENSE, README.md $dist
          Set-Content -Path "$dist/VERSION" -Value $ver
          Compress-Archive -Path $dist -DestinationPath "lode-windows-x64-$ver.zip"

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" "lode-windows-x64-${{ steps.version.outputs.version }}.zip" --title "Nightly ${{ steps.version.outputs.version }}" --notes "Automated nightly build. Built and validated on the sanity suite and integration tests." --prerelease

name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  # Cheap gate for scheduled runs: skip the expensive Windows build when a
  # nightly already shipped today and nothing changed since the last one.
  # Manual dispatches always run.
  nightly-guard:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether the nightly is needed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -uo pipefail

          # Manual dispatches always run, scheduled ones may be skipped.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: running."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Already shipped a nightly today?
          DATE_UTC=$(date -u +%Y%m%d)
          TODAY_COUNT=$(git ls-remote --tags origin \
            "refs/tags/1.0.0-nightly.${DATE_UTC}-*" \
            "refs/tags/1.0.0-nightly.${DATE_UTC}.*" | wc -l | tr -d ' ')
          if [ "$TODAY_COUNT" -eq 0 ]; then
            echo "No nightly published today yet: running."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything committed since the most recent nightly tag?
          # Sort by tag name (date-prefixed, version-aware): lightweight tags
          # would otherwise fall back to commit dates under --sort=-creatordate.
          PREV_TAG=$(git tag --list '1.0.0-nightly.*' | sort -rV | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous nightly tag found: running."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW_COMMITS=$(git rev-list "${PREV_TAG}..HEAD" --count)
          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "$NEW_COMMITS new commit(s) since $PREV_TAG: running."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "A nightly already ran today and nothing changed since $PREV_TAG: skipping."
          echo "needed=false" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      # Full history and tags: the release-notes step walks commits and
      # nightly tags to describe everything changed since the last build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute nightly version
        id: version
        shell: bash
        run: |
          # Nightly versioning is 1.0.0-nightly.YYYYMMDD.N (dot suffix).
          # The counter also accounts for legacy 1.0.0-nightly.YYYYMMDD-N
          # (dash suffix) tags so a same-day manual run continues from the
          # last published number instead of restarting at .1.
          DATE_UTC=$(date -u +%Y%m%d)
          SUFFIXES=$(git ls-remote --tags origin \
            "refs/tags/1.0.0-nightly.${DATE_UTC}-*" \
            "refs/tags/1.0.0-nightly.${DATE_UTC}.*" \
            | awk '{ ref = $2; sub(/refs\/tags\/1\.0\.0-nightly\.[0-9]+[-.]/, "", ref); if (ref ~ /^[0-9]+$/) print ref }')
          MAX=0
          for S in $SUFFIXES; do
            [ "$S" -gt "$MAX" ] && MAX=$S
          done
          N=$((MAX + 1))
          echo "version=1.0.0-nightly.${DATE_UTC}.${N}" >> "$GITHUB_OUTPUT"

      # 1. Set up the sccache tool. The Visual Studio (MSBuild) generator
      #    ignores CMAKE_<LANG>_COMPILER_LAUNCHER, so CI uses the Ninja
      #    generator (with separate Debug/Release trees), which honors it.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      # 2. Restore/save cache of compiled C++ objects, falling back to the
      #    cache written by the ci workflow so main and nightly share hits.
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-sccache-nightly-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-nightly-
            ${{ runner.os }}-sccache-

      # 3. Restore/save dependencies downloaded via FetchContent. Both build
      #    trees share one base via FETCHCONTENT_BASE_DIR so there is a single
      #    source/download to cache.
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # 4. Ninja needs the MSVC toolchain on PATH; without this it would pick
      #    the MinGW GCC that is also present on windows-latest runners.
      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      # 5. Configure Debug (Ninja single-config tree). ${{ runner.temp }} is
      #    only available in step-level env, not workflow/job-level env.
      - name: Configure Debug
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: >-
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Debug
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-debug

      - name: Validate Debug (sanity suite)
        run: ./build-debug/bin/Debug/lode.exe modules/sanity/run.luau

      - name: "Validate Debug (ctest: native fixtures + diagnostics)"
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      # 6. Configure Release (Ninja single-config tree, reuses shared deps)
      - name: Configure Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: >-
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-release

      - name: Validate Release (sanity suite)
        run: ./build-release/bin/Release/lode.exe modules/sanity/run.luau

      - name: "Validate Release (ctest: native fixtures + diagnostics)"
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Show sccache stats
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $distributionDist = "dist/lode"
          $runtimeBinDist = "$distributionDist/bin"
          $stdlibDist = "$distributionDist/stdlib"
          $sdkDist = "dist/sdk"
          $modulePackagesDist = "dist/stdlib-packages"
          New-Item -ItemType Directory -Force -Path $runtimeBinDist, $stdlibDist, $sdkDist, $modulePackagesDist | Out-Null

          # ---- SDK artifact: install both configurations into one prefix ----
          # The SDK is consumed through find_package(Lode CONFIG REQUIRED).
          # Installing both configurations keeps the package workflow aligned
          # with the Debug/Release ABI contract.
          cmake --install build-debug --config Debug --prefix $sdkDist --component LodeSDK
          cmake --install build-release --config Release --prefix $sdkDist --component LodeSDK
          Copy-Item LICENSE, README.md $sdkDist
          Set-Content -Path "$sdkDist/VERSION" -Value $ver

          # ---- Runtime distribution: executable and runtime DLLs ----
          # The end-user archive contains the runtime and the bundled stdlib.
          # SDK headers and CMake targets remain in the separate SDK archive.
          Copy-Item build-release/bin/Release/lode.exe $runtimeBinDist
          Copy-Item build-release/bin/Release/LodeCore.dll $runtimeBinDist
          Copy-Item build-release/bin/Release/uv.dll $runtimeBinDist
          Copy-Item LICENSE, README.md $distributionDist
          Set-Content -Path "$distributionDist/VERSION" -Value $ver

          # ---- Standard library: recursive module discovery ----
          # Every directory (recursively) that has a lode.json manifest is a
          # standard module (native or pure-Luau). This supports nested modules
          # such as filesystem/path without touching this workflow when modules
          # change.
          $moduleDirs = Get-ChildItem modules -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName "lode.json") }
          $modulesRoot = (Resolve-Path modules).Path
          $moduleRecords = @{}

          foreach ($mdir in $moduleDirs) {
              $manifestPath = Join-Path $mdir.FullName "lode.json"
              $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
              $name = [string]$manifest.name
              $version = [string]$manifest.version
              $rel = $mdir.FullName.Substring($modulesRoot.Length + 1).Replace('\', '/')

              if ([string]::IsNullOrWhiteSpace($name) -or [string]::IsNullOrWhiteSpace($version)) {
                  throw "Standard module manifest is missing name or version: $manifestPath"
              }
              if ($moduleRecords.ContainsKey($name)) {
                  throw "Duplicate standard module name '$name' in $manifestPath"
              }
              if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
                  throw "Standard module '$name' has an invalid SemVer: $version"
              }

              $moduleRecords[$name] = [pscustomobject]@{
                  Name = $name
                  Version = $version
                  RelativePath = $rel
                  SourcePath = $mdir.FullName
                  Manifest = $manifest
              }
          }

          # Standard-module dependencies are resolved against this same
          # nightly bundle. They use exact versions so a bundle cannot silently
          # ship an incompatible transitive module.
          foreach ($record in $moduleRecords.Values) {
              $dependencies = $record.Manifest.dependencies
              if ($null -eq $dependencies) { continue }

              foreach ($dependency in $dependencies.PSObject.Properties) {
                  if ($dependency.Value -isnot [string]) {
                      throw "Standard module '$($record.Name)' must use an exact version string for dependency '$($dependency.Name)'."
                  }
                  $requestedVersion = [string]$dependency.Value
                  if (-not $moduleRecords.ContainsKey($dependency.Name)) {
                      throw "Standard module '$($record.Name)' depends on missing standard module '$($dependency.Name)'."
                  }
                  $availableVersion = $moduleRecords[$dependency.Name].Version
                  if ($requestedVersion -ne $availableVersion) {
                      throw "Standard module '$($record.Name)' requires $($dependency.Name)@$requestedVersion, but the nightly bundle contains $availableVersion."
                  }
              }
          }

          # Map of module relative paths (forward slashes) so a parent module's
          # copy skips its nested module directories (handled separately).
          $moduleRelSet = @{}
          foreach ($mdir in $moduleDirs) {
              $rel = $mdir.FullName.Substring($modulesRoot.Length + 1).Replace('\', '/')
              $moduleRelSet[$rel] = $true
          }

          foreach ($record in ($moduleRecords.Values | Sort-Object RelativePath)) {
              $rel = $record.RelativePath
              $name = $record.Name
              $src = "modules/$rel"
              $dst = Join-Path $stdlibDist "modules/$rel"
              New-Item -ItemType Directory -Force -Path $dst | Out-Null

              $isNative = Test-Path "$src/CMakeLists.txt"
              Get-ChildItem $src | ForEach-Object {
                  $childRel = "$rel/$($_.Name)"
                  $isNestedModule = $_.PSIsContainer -and $moduleRelSet.ContainsKey($childRel)
                  # Exclude build-time files and the libs/ tree (rebuilt below
                  # with only the shipped platform, windows/x64). src/ is
                  # excluded only for native modules (those with a
                  # CMakeLists.txt); pure-Luau modules keep their src/.
                  $isExcluded = $_.Name -eq "CMakeLists.txt" -or $_.Name -eq "libs" -or ($_.Name -eq "src" -and $isNative)
                  if (-not $isNestedModule -and -not $isExcluded) {
                      Copy-Item $_.FullName (Join-Path $dst $_.Name) -Recurse
                  }
              }

              # Native modules keep their config-matched DLL in the module's
              # own libs/<platform>/<arch>/<config> entry from lode.json; the
              # loader resolves the config-aware subdir per runtime build.
              if ($isNative) {
                  $libRelease = "$src/libs/windows/x64/Release/$name.dll"
                  $libFlat = "$src/libs/windows/x64/$name.dll"
                  $libBin = "build-release/bin/Release/$name.dll"

                  $sourceDll = $null
                  if (Test-Path $libRelease) {
                      $sourceDll = $libRelease
                  } elseif (Test-Path $libFlat) {
                      $sourceDll = $libFlat
                  } elseif (Test-Path $libBin) {
                      $sourceDll = $libBin
                  }

                  if ($sourceDll) {
                      $libDirRelease = "$dst/libs/windows/x64/Release"
                      New-Item -ItemType Directory -Force -Path $libDirRelease | Out-Null
                      Copy-Item $sourceDll "$libDirRelease/$name.dll" -Force
                  } else {
                      Write-Error "Native library for $name was not found at $libRelease, $libFlat, or $libBin"
                  }
              }
              $packageDst = Join-Path $modulePackagesDist $name
              New-Item -ItemType Directory -Force -Path $packageDst | Out-Null
              Copy-Item (Join-Path $dst '*') $packageDst -Recurse -Force
              if (-not (Test-Path (Join-Path $packageDst "LICENSE"))) {
                  Copy-Item LICENSE (Join-Path $packageDst "LICENSE")
              }

              $moduleArchive = "lode-stdlib-$name-$($record.Version)-windows-x64.zip"
              Compress-Archive -Path "$packageDst/*" -DestinationPath $moduleArchive -Force
              $moduleHash = (Get-FileHash -LiteralPath $moduleArchive -Algorithm SHA256).Hash.ToLowerInvariant()
              "$moduleHash  $moduleArchive" | Set-Content -Path "$moduleArchive.sha256" -Encoding ascii
          }

          # Alias config so require("@name") resolves for every shipped module.
          $aliasLines = foreach ($record in ($moduleRecords.Values | Sort-Object RelativePath)) {
              $rel = $record.RelativePath
              $name = $record.Name
              $aliasLine = ('            ' + $name + ' = "modules/' + $rel + '",')
              $aliasLine
          }
          $config = @"
          return {
              luau = {
                  aliases = {
          $($aliasLines -join "`n")
                  }
              }
          }
          "@
          Set-Content -Path "$stdlibDist/.config.luau" -Value $config
          Set-Content -Path "$stdlibDist/VERSION" -Value $ver

          # Package CI runs the SDK's lode executable for dependency
          # installation and validation. Keep the exact bundled stdlib catalog
          # beside that executable so standard-module dependencies resolve in
          # the SDK archive without requiring a second runtime download.
          $sdkStdlibDist = Join-Path $sdkDist "stdlib"
          New-Item -ItemType Directory -Force -Path $sdkStdlibDist | Out-Null
          Copy-Item "$stdlibDist/*" $sdkStdlibDist -Recurse -Force

          Compress-Archive -Path "$distributionDist/*" -DestinationPath "lode-windows-x64-$ver.zip"
          Compress-Archive -Path "$sdkDist/*" -DestinationPath "lode-sdk-windows-x64-$ver.zip"

          foreach ($archive in @(
              "lode-windows-x64-$ver.zip",
              "lode-sdk-windows-x64-$ver.zip"
          )) {
              $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $archive" | Set-Content -Path "$archive.sha256" -Encoding ascii
          }

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -uo pipefail
          REPO="${GITHUB_REPOSITORY}"
          WORKDIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          NOTES_FILE="$WORKDIR/release-notes.md"

          # Newest existing nightly tag bounds the range; the very first
          # nightly falls back to the whole history. PREV_TAG_IN exists only
          # for local dry-runs of this script.
          PREV_TAG="${PREV_TAG_IN:-$(git tag --list '1.0.0-nightly.*' | sort -rV | head -n 1)}"
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"

          # Collect unique merged PRs (and stray direct-push commits),
          # oldest first, with one API lookup per commit.
          declare -a ORDER=() NEW_LINES=()
          declare -A SEEN=() PR_TITLE=() PR_LOGIN=() PR_SHA=() SHA_EMAIL=()

          git log --reverse --format='%H%x09%h%x09%s%x09%ae' "$RANGE" > "$WORKDIR/_commits.tsv"
          while IFS=$'\t' read -r sha short subject email; do
            SHA_EMAIL["$sha"]="$email"
            meta="$(gh api "repos/$REPO/commits/$sha/pulls" \
              --jq '(map(select(.merged_at != null)) | first) as $p
                    | if $p == null then ""
                      else "\($p.number)\t\($p.user.login // "")\t\($p.title // "")" end' 2>/dev/null || true)"
            if [ -n "$meta" ]; then
              num="${meta%%$'\t'*}"
              rest="${meta#*$'\t'}"
              login="${rest%%$'\t'*}"
              title="${rest#*$'\t'}"
              if [ -z "${SEEN[pr:$num]:-}" ]; then
                SEEN[pr:$num]=1
                ORDER+=("pr:$num")
                PR_TITLE[pr:$num]="$title"
                PR_LOGIN[pr:$num]="$login"
                PR_SHA[pr:$num]="$sha"
              fi
            else
              # Commit without an associated pull request.
              if [ -z "${SEEN[sha:$sha]:-}" ]; then
                SEEN[sha:$sha]=1
                ORDER+=("sha:$short")
                PR_TITLE[sha:$short]="$subject"
              fi
            fi
          done < "$WORKDIR/_commits.tsv"
          rm -f "$WORKDIR/_commits.tsv"

          {
            echo "Automated nightly build."

            # Nothing merged since the previous nightly: publish plain
            # notes without What's Changed, New Contributors, or compare.
            if [ "${#ORDER[@]}" -gt 0 ]; then
              echo
              echo "## What's Changed"
              echo
              for key in "${ORDER[@]}"; do
                case "$key" in
                  pr:*)
                    num="${key#pr:}"
                    echo "* ${PR_TITLE[$key]} by @${PR_LOGIN[$key]} in #$num"
                    ;;
                  *)
                    echo "* ${PR_TITLE[$key]} (${key#sha:})"
                    ;;
                esac
              done
              echo

              if [ -n "$PREV_TAG" ]; then
                git log --format='%ae' "$PREV_TAG" | sort -u > "$WORKDIR/_authors_before.txt"
                declare -A NEW_SEEN=()
                for key in "${ORDER[@]}"; do
                  case "$key" in pr:*) ;; *) continue ;; esac
                  login="${PR_LOGIN[$key]}"
                  email="${SHA_EMAIL[${PR_SHA[$key]}]:-}"
                  [ -n "$login" ] || continue
                  [ -n "$email" ] || continue
                  [ -z "${NEW_SEEN[$login]:-}" ] || continue
                  if ! grep -qxF "$email" "$WORKDIR/_authors_before.txt"; then
                    NEW_SEEN["$login"]=1
                    NEW_LINES+=("* @$login made their first contribution in #${key#pr:}")
                  fi
                done
                rm -f "$WORKDIR/_authors_before.txt"
                if [ "${#NEW_LINES[@]}" -gt 0 ]; then
                  echo "## New Contributors"
                  echo
                  printf '%s\n' "${NEW_LINES[@]}"
                  echo
                fi
                echo "**Full Changelog**: https://github.com/$REPO/compare/$PREV_TAG...$NIGHTLY_VERSION"
              fi
            fi
          } > "$NOTES_FILE"

          cat "$NOTES_FILE"

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" `
            "lode-windows-x64-${{ steps.version.outputs.version }}.zip" `
            "lode-windows-x64-${{ steps.version.outputs.version }}.zip.sha256" `
            "lode-sdk-windows-x64-${{ steps.version.outputs.version }}.zip" `
            "lode-sdk-windows-x64-${{ steps.version.outputs.version }}.zip.sha256" `
            lode-stdlib-*.zip `
            lode-stdlib-*.zip.sha256 `
            --title "Nightly ${{ steps.version.outputs.version }}" `
            --notes-file "${{ runner.temp }}/release-notes.md" `
            --prerelease

name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  nightly-guard:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether the nightly is needed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: running."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE_UTC=$(date -u +%Y%m%d)
          TODAY_COUNT=$(git ls-remote --tags origin \
            "refs/tags/1.0.0-nightly.${DATE_UTC}-*" \
            "refs/tags/1.0.0-nightly.${DATE_UTC}.*" | wc -l | tr -d ' ')
          if [ "$TODAY_COUNT" -eq 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV_TAG=$(git tag --list '1.0.0-nightly.*' | sort -rV | head -n 1)
          if [ -z "$PREV_TAG" ] || [ "$(git rev-list "${PREV_TAG}..HEAD" --count)" -gt 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute nightly version
        id: version
        shell: bash
        run: |
          DATE_UTC=$(date -u +%Y%m%d)
          SUFFIXES=$(git ls-remote --tags origin \
            "refs/tags/1.0.0-nightly.${DATE_UTC}-*" \
            "refs/tags/1.0.0-nightly.${DATE_UTC}.*" \
            | awk '{ ref = $2; sub(/refs\/tags\/1\.0\.0-nightly\.[0-9]+[-.]/, "", ref); if (ref ~ /^[0-9]+$/) print ref }')
          MAX=0
          for S in $SUFFIXES; do [ "$S" -gt "$MAX" ] && MAX=$S; done
          echo "version=1.0.0-nightly.${DATE_UTC}.$((MAX + 1))" >> "$GITHUB_OUTPUT"

  build:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ddd0023b0eee70986e42ed49d9d4afb8098f212e

      - name: Select target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = windows ]; then
            echo "architecture=x64" >> "$GITHUB_OUTPUT"
            echo "triplet=x64-windows" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.platform }}" = linux ]; then
            echo "architecture=x64" >> "$GITHUB_OUTPUT"
            echo "triplet=x64-linux" >> "$GITHUB_OUTPUT"
          elif [ "$(uname -m)" = arm64 ]; then
            echo "architecture=arm64" >> "$GITHUB_OUTPUT"
            echo "triplet=arm64-osx" >> "$GITHUB_OUTPUT"
          else
            echo "architecture=x64" >> "$GITHUB_OUTPUT"
            echo "triplet=x64-osx" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sccache on Windows
        if: matrix.platform == 'windows'
        run: choco install sccache -y --no-progress

      - name: Setup sccache on POSIX
        if: matrix.platform != 'windows'
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-${{ steps.target.outputs.triplet }}-sccache-nightly-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.target.outputs.triplet }}-sccache-nightly-
            ${{ runner.os }}-${{ steps.target.outputs.triplet }}-sccache-

      - name: Restore vcpkg binary packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-${{ steps.target.outputs.triplet }}-vcpkg-nightly-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.target.outputs.triplet }}-vcpkg-
            ${{ runner.os }}-vcpkg-

      - name: Restore FetchContent
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-fetchcontent-nightly-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Enable MSVC toolchain
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Debug on Windows
        if: matrix.platform == 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: >-
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure Debug on POSIX
        if: matrix.platform != 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        shell: bash
        run: >-
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Debug
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-debug

      - name: Validate Debug sanity suite on Windows
        if: matrix.platform == 'windows'
        run: ./build-debug/bin/Debug/lode.exe modules/sanity/run.luau

      - name: Validate Debug sanity suite on POSIX
        if: matrix.platform != 'windows'
        run: ./build-debug/bin/Debug/lode modules/sanity/run.luau

      - name: Validate Debug with CTest
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      - name: Configure Release on Windows
        if: matrix.platform == 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: >-
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure Release on POSIX
        if: matrix.platform != 'windows'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        shell: bash
        run: >-
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ steps.target.outputs.triplet }}
          -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Release
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: cmake --build build-release

      - name: Validate Release sanity suite on Windows
        if: matrix.platform == 'windows'
        run: ./build-release/bin/Release/lode.exe modules/sanity/run.luau

      - name: Validate Release sanity suite on POSIX
        if: matrix.platform != 'windows'
        run: ./build-release/bin/Release/lode modules/sanity/run.luau

      - name: Validate Release with CTest
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Show sccache stats
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: sccache --show-stats

      - name: Package Windows archives
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./.github/scripts/package-stdlib.ps1 -Version '${{ needs.nightly-guard.outputs.version }}'

      - name: Package POSIX archives
        if: matrix.platform != 'windows'
        shell: pwsh
        run: >-
          ./.github/scripts/package-stdlib.ps1
          -Version '${{ needs.nightly-guard.outputs.version }}'
          -Platform '${{ matrix.platform }}'
          -Architecture '${{ steps.target.outputs.architecture }}'

      - name: Upload platform archives
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}-${{ steps.target.outputs.architecture }}
          path: lode-*.zip
          if-no-files-found: error
          retention-days: 1

  finalize-release:
    needs: [nightly-guard, build]
    if: needs.nightly-guard.outputs.needed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download workflow archives
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: release
          merge-multiple: true

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ needs.nightly-guard.outputs.version }}
        shell: bash
        run: bash ./.github/scripts/generate-release-notes.sh

      - name: Create and publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ needs.nightly-guard.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum lode-*.zip > SHA256SUMS
          assets=(lode-*.zip SHA256SUMS)
          gh release create "$NIGHTLY_VERSION" "${assets[@]}" \
            --title "Nightly $NIGHTLY_VERSION" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --prerelease \
            --repo "$GITHUB_REPOSITORY"
